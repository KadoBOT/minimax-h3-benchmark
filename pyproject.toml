[project]
name = "h3lab"
version = "0.1.0"
description = "Benchmark, judge, and compare MiniMax H3 video generations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[project.scripts]
h3lab = "h3lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
